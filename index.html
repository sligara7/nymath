<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember</title>
<meta name="description" content="Teach a drake her arithmetic. New York State Grade 3.">
<meta name="theme-color" content="#17212b">

<meta property="og:type" content="website">
<meta property="og:title" content="Ember">
<meta property="og:description" content="She hatched knowing nothing. Teach her.">
<meta property="og:url" content="https://sligara7.github.io/nymath/">

<!-- Inline so there is no second request and no 404 for favicon.ico. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='26' fill='%23ff8a3d'/%3E%3Cpath d='M18 14l4-12 8 12z' fill='%23f2d9b8'/%3E%3Cpath d='M46 14l-4-12-8 12z' fill='%23f2d9b8'/%3E%3Ccircle cx='23' cy='30' r='6' fill='%23fff'/%3E%3Ccircle cx='41' cy='30' r='6' fill='%23fff'/%3E%3Ccircle cx='24' cy='31' r='3' fill='%23241a12'/%3E%3Ccircle cx='42' cy='31' r='3' fill='%23241a12'/%3E%3C/svg%3E">

<!-- Bumped on every deploy. If somebody reports a stale page, this number in
     their console says which build they are actually running. -->
<meta name="build" content="8">

<!-- On her iPhone, Add to Home Screen makes Ember an app of her own, which
     iPhone Safari's week-long clear-out cannot touch. Deliberately NO web app
     manifest: without a start_url, iOS keeps the address she was on, and on an
     iPhone that address carries her save (see js/keep.js). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ember">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=8">

<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

<!-- Everything lives on one page. She never navigates; the scene changes
     around her. On a phone, a page transition is a chance to lose someone. -->

<header class="bar" id="bar" hidden>
  <div class="where">
    <span class="lesson-name" id="lessonName"></span>
    <span class="std" id="lessonStd"></span>
  </div>
  <div class="bar-buttons">
    <button class="home" id="denBtn" aria-label="Ember's den" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.5 11.5 L12 4 L20.5 11.5 M6 10 V20 H18 V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M10 20 V15 H14 V20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </button>
    <button class="sound" id="soundBtn" aria-label="Sound on or off">
      <span id="soundIcon">◈</span>
    </button>
  </div>
</header>

<!-- THE DOOR. Nothing plays until she taps, because no browser will let sound
     start on its own — so the tap that begins the game is the same tap that
     turns the wind on. One gesture, doing two jobs, and she never sees the
     second one. -->
<main class="door" id="door">
  <div class="door-art" id="doorArt"></div>
  <h1>Ember</h1>
  <p class="door-line">She hatched yesterday.<br>She does not know anything yet.</p>
  <button class="big" id="startBtn">Go and meet her</button>
  <p class="door-foot" id="doorFoot"></p>
</main>

<!-- Ember asks who the player is. Her name never leaves her phone and is never in this
     repository — which is the whole reason it is typed rather than written in. -->
<main class="door" id="naming" hidden>
  <div class="door-art" id="namingArt"></div>
  <p class="door-line" id="namingSays">Oh. Hello.<br>Who are <em>you</em>?</p>
  <input class="namefield" id="nameInput" type="text" inputmode="text"
         autocomplete="off" autocorrect="off" spellcheck="false"
         maxlength="14" placeholder="type your name" aria-label="Your name">
  <button class="big" id="nameBtn">Tell her</button>
  <p class="door-foot">It stays on this phone.</p>
</main>

<main class="scene" id="scene" hidden>

  <!-- Ember and what she is saying. Ember gets things wrong up here so that
       nothing down in the nest ever reads as the PLAYER being wrong. -->
  <section class="him">
    <div class="ember-holder" id="emberHolder"></div>
    <div class="bubble" id="bubble"><p id="emberSays"></p></div>
  </section>

  <!-- What the player is being asked to show Ember. One line, never two. -->
  <p class="task" id="task"></p>

  <!-- A clue, once she has asked for one. Never before. -->
  <p class="clue" id="clueText" hidden></p>

  <!-- On the quest only: the lesson Ember is reaching for, named. -->
  <p class="recalls" id="recalls"></p>

  <!-- The nest: the picture she builds. -->
  <section class="surface" id="surface"></section>

  <!-- The arithmetic, made visible as she builds. Empty until it has
       something true to say. -->
  <div class="readout" id="readout"></div>

  <div class="actions">
    <!-- Help in three steps, only when she asks. js/main.js. -->
    <button class="clue-btn" id="clueBtn" hidden>Want a clue?</button>
    <button class="ghost" id="clearBtn" hidden>Start her nest again</button>
    <button class="big" id="nextBtn" hidden>Next</button>
  </div>

</main>

<!-- EMBER'S DEN. Out of the cave and into daylight: a room she furnishes,
     clothes for Ember, snacks — all of it bought from the hoard, and the hoard
     only fills when she teaches. Drawn in the spirit of the games she already
     loves, from our own drawings. -->
<main class="den" id="den" hidden>
  <div class="den-top">
    <button class="den-back" id="denBack">‹ Lessons</button>
    <div class="den-coins">
      <div class="purse-mini" id="purseMini" aria-label="Ember's hoard"></div>
      <!-- The answer to "how do I get more coins?": straight into the lesson
           that pays. The same place Pip's button sends her. -->
      <button class="den-earn" id="denEarn">+ Get more coins</button>
    </div>
  </div>

  <!-- iPhone only, until "Got it": how to keep Ember safe. js/keep.js. -->
  <div class="keep-tip" id="keepTip" hidden>
    <p><b>Keep Ember safe on this phone!</b> Ask a grown-up to tap
      <svg class="share" viewBox="0 0 24 24" aria-label="Share"><path d="M12 3 V15 M7.5 7.5 L12 3 L16.5 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11 H6 V21 H18 V11 H16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      Share, then <b>Add to Home Screen</b>.</p>
    <button class="keep-ok" id="keepTipOk">Got it</button>
  </div>

  <section class="room wall-pink" id="room">
    <svg class="window" viewBox="0 0 120 96" aria-hidden="true">
      <rect x="4" y="4" width="112" height="84" rx="10" fill="#bfe6ff" stroke="#5b3a2e" stroke-width="4"/>
      <path d="M14 70 q0 -9 9 -9 q4 -7 12 -4 q8 -2 10 6 q7 0 7 7 z" fill="#ffffff"/>
      <path d="M70 34 q0 -6 6 -6 q3 -5 9 -3 q6 -1 7 5 q5 0 5 4 z" fill="#ffffff"/>
      <g transform="translate(82 26)">
        <circle r="16" fill="#ffd166" stroke="#5b3a2e" stroke-width="3"/>
        <circle cx="-5.5" cy="-2" r="2.2" fill="#5b3a2e"/><circle cx="5.5" cy="-2" r="2.2" fill="#5b3a2e"/>
        <path d="M-6 5 Q0 11 6 5" fill="none" stroke="#5b3a2e" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="-10" cy="4" r="2.6" fill="#ff9fb8" opacity="0.8"/><circle cx="10" cy="4" r="2.6" fill="#ff9fb8" opacity="0.8"/>
      </g>
      <path d="M60 6 V86 M6 46 H114" stroke="#ffffff" stroke-width="5"/>
      <path d="M60 6 V86 M6 46 H114" stroke="#5b3a2e" stroke-width="1.5"/>
      <rect x="0" y="84" width="120" height="10" rx="4" fill="#ffffff" stroke="#5b3a2e" stroke-width="3"/>
    </svg>
    <div class="floor" aria-hidden="true"></div>
    <div class="room-items" id="roomItems"></div>
    <p class="den-says" id="denSays" hidden></p>
  </section>

  <nav class="drawer-tabs">
    <button class="tab on" id="tabWear">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17 Q4 9 12 7 Q20 9 19 17 Z" fill="#ff8fb1" stroke="#5b3a2e" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 17 H21" stroke="#5b3a2e" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="6" r="2" fill="#ffd166" stroke="#5b3a2e" stroke-width="1.4"/></svg>
      Wear
    </button>
    <button class="tab" id="tabRoom">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="10" width="18" height="7" rx="3" fill="#7dd3c8" stroke="#5b3a2e" stroke-width="1.8"/><rect x="6" y="6" width="12" height="6" rx="2" fill="#a9e8d6" stroke="#5b3a2e" stroke-width="1.8"/><path d="M5 17 V20 M19 17 V20" stroke="#5b3a2e" stroke-width="2" stroke-linecap="round"/></svg>
      Room
    </button>
    <button class="tab" id="tabFood">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 12 L22 8 L22 16 Z" fill="#5aa9e6" stroke="#5b3a2e" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="11" cy="12" rx="8" ry="5" fill="#7ec3f0" stroke="#5b3a2e" stroke-width="1.8"/><circle cx="7" cy="11" r="1.1" fill="#5b3a2e"/></svg>
      Food
    </button>
  </nav>

  <section class="drawer" id="drawer"></section>
</main>

<!-- Pip the mole's shop counter. Exact money only — Pip has no change. -->
<div class="shop-wrap" id="shopWrap" hidden>
  <div class="shop" id="shop"></div>
</div>

<!-- The reveal: the maths sentence that was true the whole time she was
     building. It arrives AFTER she has built it, never before — that order is
     the entire pedagogy of this thing. -->
<div class="reveal-wrap" id="revealWrap" hidden>
  <div class="reveal" id="reveal">
    <div id="revealBody"></div>
    <button class="big" id="revealNext">Go on</button>
    <!-- Only at the end of a lesson: the den is the celebration AFTER
         teaching, never a way out of the middle of it. -->
    <button class="ghost" id="revealDen" hidden>Visit Ember's den</button>
  </div>
</div>

<!-- When three clues were not enough and she asked to stop: Ember is kind
     about it, and the hard one waits until another day. -->
<div class="reveal-wrap" id="stopWrap" hidden>
  <div class="reveal">
    <div class="stop-art" id="stopArt"></div>
    <p class="said" id="stopSays"></p>
    <button class="big" id="stopReview">Teach Ember one she knows</button>
    <button class="ghost" id="stopDen">Go to Ember's den</button>
  </div>
</div>

<script src="content/grade3.js?v=8"></script>
<script src="content/quest3.js?v=8"></script>
<script src="content/den.js?v=8"></script>
<script src="js/save.js?v=8"></script>
<script src="js/keep.js?v=8"></script>
<script src="js/audio.js?v=8"></script>
<script src="js/ember.js?v=8"></script>
<script src="js/nest.js?v=8"></script>
<script src="js/lessons.js?v=8"></script>
<script src="js/quest.js?v=8"></script>
<script src="js/hoard.js?v=8"></script>
<script src="js/den.js?v=8"></script>
<script src="js/main.js?v=8"></script>
</body>
</html>
